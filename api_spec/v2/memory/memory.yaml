module: memory
#
# Memory that DuckDB accounts for. An extension that keeps sizeable state of its own - decompressed blocks, decoded
# dictionaries, read buffers, caches - can allocate it through these functions instead of `malloc`, so that the
# database counts it against `memory_limit`, reports it in `duckdb_memory()` under the `EXTENSION` tag, and makes room
# for it by evicting buffer-managed data when it would not otherwise fit. An allocation that cannot be made to fit
# fails with `ERROR_RESOURCE_OUT_OF_MEMORY` rather than taking the database over its limit.
#
# The memory is not buffer-managed: the database never evicts it or spills it to disk, so it stays at its address and
# is counted until it is freed. Keep it for state that is in use, and free it as soon as it is not.

#-----------------------------------------------------------------------------------------------------------------------
# Handles
#-----------------------------------------------------------------------------------------------------------------------
handles:
  memory_buffer:
    description: |
      An owned opaque handle to a block of memory the database accounts for, allocated with
      `[[context_allocate_memory]]` or `[[instance_allocate_memory]]` and destroyed with `[[memory_buffer_destroy]]`.
      Read and write its bytes through the pointer `[[memory_buffer_get_data]]` returns.

      The memory counts against the `memory_limit` of the database it was allocated from until the buffer is
      destroyed. It may outlive the callback, query or connection it was allocated in - e.g. held in a function's bind
      data or global state - and destroying it after the database was closed is safe: the memory is then freed without
      being accounted.
    cleanup_with: memory_buffer_destroy

#-----------------------------------------------------------------------------------------------------------------------
# Functions
#-----------------------------------------------------------------------------------------------------------------------
functions:
  context_allocate_memory:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-06" ]
    description: |
      Allocates a block of memory the database of a context accounts for.

      The block holds `size` uninitialized bytes, aligned for any fundamental type, and counts against the
      `memory_limit` of the context's database until it is destroyed. When it would take the database over its limit,
      the database first evicts buffer-managed data to make room; when that is not enough, the allocation fails with
      `ERROR_RESOURCE_OUT_OF_MEMORY`. The caller owns the returned buffer and must destroy it with
      `[[memory_buffer_destroy]]`.
    parameters:
      context:
        type: context
        description: The context whose database accounts for the memory.
      size:
        type: idx
        description: How many bytes to allocate. May be 0.
      buffer:
        type: memory_buffer
        indirection: 1
        kind: OUT
        description: On success, receives the allocated buffer. Owned by the caller; destroy via `[[memory_buffer_destroy]]`.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  instance_allocate_memory:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-06" ]
    description: |
      Allocates a block of memory the database of an instance accounts for.

      The same as `[[context_allocate_memory]]`, for memory that is not tied to a query, e.g. a cache an embedder
      keeps for the lifetime of the instance.
    role: method
    belongs_to: instance
    parameters:
      instance:
        type: instance
        description: The instance whose database accounts for the memory.
      size:
        type: idx
        description: How many bytes to allocate. May be 0.
      buffer:
        type: memory_buffer
        indirection: 1
        kind: OUT
        description: On success, receives the allocated buffer. Owned by the caller; destroy via `[[memory_buffer_destroy]]`.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  memory_buffer_get_data:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-06" ]
    description: |
      Returns a writable pointer to the bytes of a buffer.

      The pointer is valid until the buffer is resized with `[[memory_buffer_resize]]` or destroyed. A buffer of size
      0 may return a null pointer.
    role: getter
    belongs_to: memory_buffer
    parameters:
      buffer:
        type: memory_buffer
        description: The buffer to read.
      out_ptr:
        type: u8
        indirection: 2
        kind: OUT_BORROW
        description: Receives a writable pointer to the buffer's bytes, owned by the buffer.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  memory_buffer_get_size:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-06" ]
    description: Returns how many bytes a buffer holds, which is also how many it counts against the memory limit.
    role: getter
    belongs_to: memory_buffer
    parameters:
      buffer:
        type: memory_buffer
        description: The buffer to read.
      size:
        type: idx
        indirection: 1
        kind: OUT
        description: Receives the size of the buffer in bytes.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  memory_buffer_resize:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-06" ]
    description: |
      Grows or shrinks a buffer, keeping its contents up to the smaller of the old and the new size.

      The bytes past the old size are uninitialized. The buffer may move, so take its pointer again with
      `[[memory_buffer_get_data]]` afterwards. Growing is accounted like an allocation: when the database can not make
      room for the additional bytes, it fails with `ERROR_RESOURCE_OUT_OF_MEMORY` and leaves the buffer as it was.
      Resizing a buffer whose database was closed fails.
    role: method
    belongs_to: memory_buffer
    parameters:
      buffer:
        type: memory_buffer
        description: The buffer to resize.
      size:
        type: idx
        description: The new size in bytes. May be 0.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  memory_buffer_destroy:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-06" ]
    description: |
      Destroys a buffer, freeing its memory and returning it to the memory limit of its database.

      Null-safe: passing a null pointer or null handle is a no-op. The handle is set to null on return to prevent
      double-destruction.
    parameters:
      buffer:
        type: memory_buffer
        description: The buffer to destroy.
        indirection: 1
    return_type: ERROR
