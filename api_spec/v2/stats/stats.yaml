module: stats
#
# Statistics describe the values an expression or a column can produce. The engine propagates them through a query
# plan and uses them to simplify it, e.g. to fold `x IS NULL` to false when `x` cannot be NULL. A function takes part
# in that propagation through its stats callback (`[[scalar_function_set_stats_callback]]`,
# `[[aggregate_function_set_stats_callback]]`, `[[table_function_set_stats_callback]]`), which reads the statistics of
# its arguments and narrows the statistics of its result.
#
# Every statistic states what can occur, never what does occur: `true` means a kind of value may be present, `false`
# guarantees it is absent. The engine relies on the guarantees, so a statistic that claims less than the data holds
# produces wrong query results.
#
# Beyond validity, the statistics of numeric, temporal, boolean and string values carry a range: a minimum and a maximum
# that every non-NULL value lies within. The engine prunes and folds comparisons the range decides, e.g. `x > 100` when
# `x` cannot exceed 10. The statistics also carry an estimate of the number of distinct values, which the optimizer
# uses to plan joins and aggregates. Unlike the range, the estimate is only a hint: a wrong one makes a plan slower,
# never a result wrong.

#-----------------------------------------------------------------------------------------------------------------------
# Handles
#-----------------------------------------------------------------------------------------------------------------------
handles:
  stats:
    description: |
      A borrowed opaque handle to the statistics of an expression or a column. A stats callback receives it for the
      result it describes and for each of its arguments; it is valid only for the duration of that callback.

      The statistics of an argument are read-only, and the setters fail on them. The statistics of the result start
      out unknown, with every kind of value possible, and the callback narrows them through the setters. A callback
      that leaves the result unchanged tells the engine nothing.

#-----------------------------------------------------------------------------------------------------------------------
# Functions
#-----------------------------------------------------------------------------------------------------------------------
functions:
  #---------------------------------------------------------------------------------------------------------------------
  # Validity
  #---------------------------------------------------------------------------------------------------------------------
  stats_can_have_null:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-02" ]
    description: |
      Returns whether the values described can include NULL.

      False guarantees that every value is non-NULL.
    parameters:
      stats:
        type: stats
        description: The statistics to read.
      out:
        type: bool
        indirection: 1
        kind: OUT
        description: Receives true if a value can be NULL, false if none can.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  stats_can_have_valid:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-02" ]
    description: |
      Returns whether the values described can include a valid, non-NULL value.

      False guarantees that every value is NULL. When both this and `[[stats_can_have_null]]` are false, there are no
      values at all.
    parameters:
      stats:
        type: stats
        description: The statistics to read.
      out:
        type: bool
        indirection: 1
        kind: OUT
        description: Receives true if a value can be non-NULL, false if none can.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  stats_set_can_have_null:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-02" ]
    description: |
      Sets whether the values described can include NULL.

      Setting false is a guarantee the engine relies on: a NULL among the values then produces wrong query results.
      Setting true is always safe. Fails with `ERROR_INPUT_INVALID` on read-only statistics, such as those of an
      argument.
    parameters:
      stats:
        type: stats
        description: The statistics to modify.
      value:
        type: bool
        description: True if a value can be NULL, false if none can.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  stats_set_can_have_valid:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-10-02" ]
    description: |
      Sets whether the values described can include a valid, non-NULL value.

      Setting false is a guarantee the engine relies on: a non-NULL value among the values then produces wrong query
      results. Setting true is always safe. Fails with `ERROR_INPUT_INVALID` on read-only statistics, such as those of
      an argument.
    parameters:
      stats:
        type: stats
        description: The statistics to modify.
      value:
        type: bool
        description: True if a value can be non-NULL, false if none can.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Range
  #---------------------------------------------------------------------------------------------------------------------
  stats_get_min:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-06" ]
    description: |
      Returns the minimum of the values described: every non-NULL value is at least this value.

      Receives a NULL value when no minimum is known, which is always the case for statistics of types without a range,
      e.g. nested types. The returned value has the type the statistics describe, is owned by the caller and must be
      destroyed via `[[value_destroy]]`.

      For strings the engine may keep only a prefix of the minimum. The value returned is then the nearest string the
      engine can still guarantee, which can lie below every value described.
    parameters:
      stats:
        type: stats
        description: The statistics to read.
      value:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the owned minimum, or a NULL value when no minimum is known.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  stats_get_max:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-06" ]
    description: |
      Returns the maximum of the values described: every non-NULL value is at most this value.

      Receives a NULL value when no maximum is known, which is always the case for statistics of types without a range,
      e.g. nested types. The returned value has the type the statistics describe, is owned by the caller and must be
      destroyed via `[[value_destroy]]`.

      For strings the engine may keep only a prefix of the maximum. The value returned is then the nearest string the
      engine can still guarantee, which can lie above every value described.
    parameters:
      stats:
        type: stats
        description: The statistics to read.
      value:
        type: value
        indirection: 1
        kind: OUT
        description: Receives the owned maximum, or a NULL value when no maximum is known.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  stats_set_min:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-06" ]
    description: |
      Sets the minimum of the values described: a guarantee that every non-NULL value is at least `value`.

      The engine relies on the guarantee: a value below the minimum produces wrong query results. A minimum below every
      value is always safe, and a NULL `value` removes the minimum, which is always safe too. The value is cast to the
      type the statistics describe. Only the statistics of numeric, decimal, temporal, boolean, VARCHAR and BLOB values
      have a range.

      Fails with `ERROR_INPUT_INVALID` on read-only statistics, such as those of an argument; on statistics of a type
      without a range; when the value can not be cast to the type the statistics describe; and when the minimum would be
      greater than the maximum already set.
    parameters:
      stats:
        type: stats
        description: The statistics to modify.
      value:
        type: value
        description: The borrowed minimum, copied in. NULL removes the minimum.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  stats_set_max:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-06" ]
    description: |
      Sets the maximum of the values described: a guarantee that every non-NULL value is at most `value`.

      The engine relies on the guarantee: a value above the maximum produces wrong query results. A maximum above every
      value is always safe, and a NULL `value` removes the maximum, which is always safe too. The value is cast to the
      type the statistics describe. Only the statistics of numeric, decimal, temporal, boolean, VARCHAR and BLOB values
      have a range.

      Fails with `ERROR_INPUT_INVALID` on read-only statistics, such as those of an argument; on statistics of a type
      without a range; when the value can not be cast to the type the statistics describe; and when the maximum would be
      less than the minimum already set.
    parameters:
      stats:
        type: stats
        description: The statistics to modify.
      value:
        type: value
        description: The borrowed maximum, copied in. NULL removes the maximum.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  #---------------------------------------------------------------------------------------------------------------------
  # Distinct count
  #---------------------------------------------------------------------------------------------------------------------

  stats_get_distinct_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-06" ]
    description: |
      Returns the estimated number of distinct values described, or 0 when no estimate is known.
    parameters:
      stats:
        type: stats
        description: The statistics to read.
      out:
        type: u64
        indirection: 1
        kind: OUT
        description: Receives the estimated number of distinct values, or 0 when none is known.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR

  stats_set_distinct_count:
    lifecycle:
      - [ "unstable", "v2.0.0", "2026-11-06" ]
    description: |
      Sets the estimated number of distinct values described.

      The optimizer uses the estimate to plan, e.g. to order joins; it is not a guarantee, so a wrong estimate makes a
      plan slower but never a result wrong. 0 removes the estimate. Fails with `ERROR_INPUT_INVALID` on read-only
      statistics, such as those of an argument.
    parameters:
      stats:
        type: stats
        description: The statistics to modify.
      value:
        type: u64
        description: The estimated number of distinct values, or 0 for none known.
      err:
        type: error_info
        indirection: 1
        description: Optional. On failure, receives an opaque info handle the caller must destroy via `[[error_info_destroy]]`.
    return_type: ERROR
